# M3 B0: stock scheduler plus a coarse capacity sweep on the frozen pilot request mix.
model: "/root/autodl-tmp/models/Qwen2.5-3B-Instruct"

gpu:
  device_ids: [0]
  count: 1

# Deliberately permissive discovery SLOs. M3 freezes the formal SLOs after this pilot.
slo:
  ttft_ms: 30000
  tpot_ms: 1000
  e2e_ms: 60000

constraints:
  max_error_rate: 0.0
  max_peak_vram_mb: 31000
  max_memory_utilization: 0.95
  require_no_oom: true
  require_server_alive: true

search_space:
  gpu_memory_utilization: [0.70, 0.70]
  max_num_batched_tokens: [8192]
  max_num_seqs: [64]
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

workload:
  name: "nonstationary-pilot"
  dataset_name: "frozen:nonstationary-pilot"
  sample_size: 32
  prompt_length_distribution: "weighted"
  warmup_requests: 1
  max_concurrency: 32
  capacity_request_rates: [2, 4, 8, 12, 16, 24, 32]
  capacity_repeats: 1
  max_tokens: 256
  ignore_eos: true
  seed: 2026
  request_timeout_seconds: 300
  benchmark_backend: "sse"

telemetry:
  enabled: true
  interval_ms: 100
  collect_nvml: true

baseline:
  enabled: false

study:
  trial_budget: 1
  timeout_minutes: 60
  prune_enabled: false
  n_startup_trials: 1
  methods: ["random"]
  repeat_count: 1
  top_candidates: 1
  holdout_enabled: false
  resume: false

vllm_args:
  max-model-len: 8192
  no-async-scheduling: true

