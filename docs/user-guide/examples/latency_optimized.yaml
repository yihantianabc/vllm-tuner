# Latency-optimized tuning configuration
# Prioritize low latency over throughput

# Model to tune
model: "gpt2"

# GPU configuration
gpu:
  device_ids: [0]
  count: 1

# Multi-objective optimization weights - prioritize latency
objectives:
  throughput: 30
  latency: 70
  memory: 0

# Tuning constraints - enforce strict latency limits
constraints:
  max_latency_ms: 100
  max_memory_utilization: 0.95
  throughput_min: null

# Custom search space - smaller batches for lower latency
search_space:
  batch_size: [1, 64]
  max_num_batched_tokens: [1024, 8192]
  max_num_seqs: [16, 128]
  gpu_memory_utilization: [0.7, 0.95]
  tensor_parallel_size: null
  pipeline_parallel_size: null

# Benchmark workload configuration
workload:
  name: "alpaca"
  dataset_name: "tatsu-lab/alpaca"
  sample_size: 100
  prompt_length_distribution: "auto"
  warmup_requests: 5
  concurrent_requests: 5

# Optuna study settings
study:
  min_trials: 30
  timeout_minutes: 60
  storage_backend: "sqlite:///studies/optuna.db"
  prune_enabled: true
  n_startup_trials: 5

# Additional arguments to pass to vLLM server
vllm_args:
  dtype: float16