# SLO-focused chat example; goodput remains the objective rather than a latency weight.
model: "/root/autodl-tmp/models/Qwen2.5-3B-Instruct"
gpu:
  device_ids: [0]
  count: 1
slo:
  ttft_ms: 500
  tpot_ms: 60
  e2e_ms: 5000
constraints:
  max_error_rate: 0.01
  max_peak_vram_mb: 30000
  max_memory_utilization: 0.92
  require_no_oom: true
  require_server_alive: true
search_space:
  gpu_memory_utilization: [0.60, 0.90]
  max_num_seqs: [8, 16, 32, 64]
  max_num_batched_tokens: [1024, 2048, 4096]
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
workload:
  name: "chat"
  dataset_name: "synthetic:chat"
  sample_size: 500
  warmup_requests: 30
  max_concurrency: 32
  request_rate: 8
  burstiness: 1.0
  max_tokens: 160
  seed: 2026
  benchmark_backend: "official"
telemetry:
  enabled: true
  interval_ms: 200
  collect_nvml: true
study:
  trial_budget: 16
  timeout_minutes: 1440
  seed: 2026
  methods: ["default", "random", "tpe"]
  repeat_count: 3
  top_candidates: 3
  holdout_enabled: true
  resume: false
baseline:
  enabled: false
vllm_args:
  max-model-len: 4096
