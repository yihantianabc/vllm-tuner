# vLLM Auto-Tuner Configuration
# Default tuning configuration with preset weights

# Model to tune
model: "Qwen/Qwen1.5-0.5B-Chat-AWQ"

# GPU configuration
gpu:
  device_ids: [0]
  count: 1

# Multi-objective optimization weights (must sum to 100)
objectives:
  throughput: 60
  latency: 30
  memory: 10

# Tuning constraints
constraints:
  max_latency_ms: null
  max_memory_utilization: null
  throughput_min: null

# Custom search space overrides (null = use default values)
search_space:
  batch_size: null
  max_num_batched_tokens: null
  max_num_seqs: null
  gpu_memory_utilization: null
  tensor_parallel_size: null
  pipeline_parallel_size: null

# Benchmark workload configuration
workload:
  name: "alpaca"
  dataset_name: "tatsu-lab/alpaca"
  sample_size: 100
  prompt_length_distribution: "auto"
  warmup_requests: 5
  concurrent_requests: 10
  max_tokens: 256

# Baseline generation (before optimization)
baseline:
  enabled: true

# Optuna study settings
study:
  min_trials: 25
  timeout_minutes: 1440
  storage_backend: "sqlite:///studies/optuna.db"
  prune_enabled: true
  n_startup_trials: 2

# Additional arguments to pass to vLLM server
vllm_args:
  max-model-len: 1024
  gpu-memory-utilization: 0.6