# Legacy filename retained to make the scope change explicit.
# SLOTune core rejects multi-GPU configs; this is a valid one-GPU RAG example.
model: "/root/autodl-tmp/models/Qwen2.5-3B-Instruct"
gpu:
  device_ids: [0]
  count: 1
slo:
  ttft_ms: 1500
  tpot_ms: 100
  e2e_ms: 10000
constraints:
  max_error_rate: 0.01
  max_peak_vram_mb: 31000
  require_no_oom: true
  require_server_alive: true
search_space:
  gpu_memory_utilization: [0.60, 0.95]
  max_num_seqs: [8, 16, 32, 64]
  max_num_batched_tokens: [1024, 2048, 4096, 8192]
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
workload:
  name: "rag"
  dataset_name: "synthetic:rag"
  sample_size: 100
  warmup_requests: 10
  max_concurrency: 16
  request_rate: 4
  burstiness: 1.5
  max_tokens: 160
  seed: 2026
  benchmark_backend: "official"
telemetry:
  enabled: true
  interval_ms: 200
  collect_nvml: true
study:
  trial_budget: 8
  timeout_minutes: 480
  seed: 2026
  methods: ["default", "random", "tpe"]
  repeat_count: 3
  top_candidates: 3
  holdout_enabled: true
  resume: false
baseline:
  enabled: false
vllm_args:
  max-model-len: 8192
