# Short 3B development run. It is not a formal benchmark protocol.
model: "/root/autodl-tmp/models/Qwen2.5-3B-Instruct"
gpu:
  device_ids: [0]
  count: 1
slo:
  ttft_ms: 3000
  tpot_ms: 300
  e2e_ms: 15000
constraints:
  max_error_rate: 0.0
  max_peak_vram_mb: 31000
  require_no_oom: true
  require_server_alive: true
search_space:
  gpu_memory_utilization: [0.70, 0.85]
  max_num_seqs: [8, 16]
  max_num_batched_tokens: [1024, 2048]
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
workload:
  name: "chat"
  dataset_name: "synthetic:chat"
  sample_size: 20
  warmup_requests: 2
  max_concurrency: 4
  request_rate: 2
  burstiness: 1.0
  max_tokens: 64
  seed: 2026
  benchmark_backend: "sse"
telemetry:
  enabled: true
  interval_ms: 200
  collect_nvml: true
study:
  trial_budget: 2
  timeout_minutes: 60
  seed: 2026
  methods: ["default", "random", "tpe"]
  repeat_count: 1
  top_candidates: 1
  holdout_enabled: true
  resume: false
baseline:
  enabled: false
vllm_args:
  max-model-len: 4096
