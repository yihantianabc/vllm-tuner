[project]
name = "vllm-tuner"
dynamic = ["version"]
description = "An intelligent auto-tuner for vLLM to maximize throughput, minimize latency and memory"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT license"}
authors = [
    {name = "Javad Anaraki"}
]

dependencies = [
    "optuna>=3.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "pynvml>=11.5.0",
    "plotly>=5.18.0",
    "httpx>=0.26.0",
    "datasets>=2.16.0",
    "transformers>=4.37.0",
    "tokenizers>=0.15.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.semantic_release]
version_source = "tag"
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python -m build"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
version_variables = ["src/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"