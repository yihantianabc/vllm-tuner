[project]
name = "vllm-tuner"
dynamic = ["version"]
description = "An intelligent auto-tuner for vLLM to maximize throughput, minimize latency and memory"
readme = "README.md"
requires-python = ">=3.10"
packages = [{include = "vllm_tuner", from = "src"}]
license = {text = "MIT license"}
authors = [
    {name = "Javad Anaraki"}
]

dependencies = [
    "optuna>=3.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "nvidia-ml-py>=13.580.0",
    "plotly>=5.18.0",
    "httpx>=0.26.0",
    # The vLLM reproduction overlay installs httpx2 2.10 through OpenAI/MCP.
    # Keep frozen core syncs from downgrading its required IDNA version.
    "idna>=3.18",
    "datasets>=2.16.0",
    # vLLM 0.16 rejects the Transformers 5 API. Keep the core lock compatible
    # so `uv sync --frozen` cannot undo the pinned GPU-runtime overlay.
    "transformers>=4.56.0,<5",
    "tokenizers>=0.15.0",
    "jinja2>=3.1.0",
    # vLLM 0.16's numba/mistral-common stack is not compatible with NumPy 2.3+.
    "numpy>=1.25,<2.3",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    # Kaleido 0.2 bundles its renderer, so static report images do not depend
    # on an unrecorded system Chrome installation on the GPU host.
    "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
vllm-tuner = "vllm_tuner.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vllm_tuner/__init__.py"

[tool.semantic_release]
version_source = "tag"
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python -m build"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
version_variables = ["src/vllm_tuner/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = [
    "integration: local HTTP/process integration tests",
    "gpu: requires an NVIDIA GPU and a local model",
    "performance: long-running benchmark experiments excluded from ordinary CI",
]
